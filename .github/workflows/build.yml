name: Build 3DS Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Game
        run: make

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmongUs3DS-Release
          path: |
            AmongUs3DS.3dsx
            AmongUs3DS.cia
          if-no-files-found: error