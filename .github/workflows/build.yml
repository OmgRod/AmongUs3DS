name: Build 3DS Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up devkitPro Pacman environment
        uses: devkitPro/action@v2
        with:
          transport: msys2
          packages: 3ds-dev

      - name: Compile Game
        run: make
        shell: msys2 {0}

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmongUs3DS-Release
          path: |
            AmongUs3DS.3dsx
            AmongUs3DS.cia
          if-no-files-found: error